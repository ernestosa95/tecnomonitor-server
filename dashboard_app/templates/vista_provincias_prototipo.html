<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TecnoMonitor · Panel Nacional Unificado</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  /* Paleta clara, plana y minimalista */
  --bg: #ffffff;
  --surface: #f8f9fa;
  --surface2: #f1f3f5;
  --border: #e9ecef;
  --green: #0b7285;
  --blue: #1c7ed6;
  --amber: #e67700;
  --red: #e03131;
  --purple: #7048e8;
  --txt: #212529;
  --muted: #868e96;
  --radius2: 4px; /* Bordes sutiles para mantener el diseño plano */
  font-family: 'Inter', system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---- CABECERA / PANEL NACIONAL ---- */
header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.header-title h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 0 0 4px;
}

.header-title p {
  color: var(--muted);
  margin: 0;
  font-size: 13px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.national-kpis {
  display: flex;
  gap: 24px;
}

.n-kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 12px 20px;
  border-radius: var(--radius2);
  min-width: 140px;
}

.n-kpi .label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

.n-kpi .value {
  font-size: 1.5rem;
  font-weight: 800;
}

/* ---- CONTENEDOR PRINCIPAL ---- */
.dashboard-unified {
  display: flex;
  flex: 1;
  min-height: 0; /* Necesario para el scroll interno */
}

/* ---- SECCIÓN MAPA (MAESTRO) ---- */
.map-section {
  flex: 1;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
}

.section-title {
  padding: 14px 24px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

#map {
  flex: 1;
  background: #e5e9ec; /* Color de fondo claro para el mapa */
  z-index: 1;
}

/* ---- TOGGLE PROVINCIA / PROYECTO ---- */
.toggle-agrupar {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  overflow: hidden;
}

.toggle-btn {
  border: none;
  background: var(--bg);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 6px 12px;
  cursor: pointer;
}

.toggle-btn.active {
  background: var(--green);
  color: #fff;
}

/* ---- TARJETAS DE PROYECTO (alternativa al mapa) ---- */
#project-cards {
  flex: 1;
  flex-direction: column;
  gap: 12px;
  padding: 24px;
  overflow-y: auto;
}

.project-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 18px 20px;
  cursor: pointer;
  transition: background 0.15s;
}

.project-card:hover { background: var(--surface2); }

.project-card-name {
  font-size: 1.1rem;
  font-weight: 800;
}

.project-card-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* ---- SECCIÓN DETALLE (PROVINCIAL) ---- */
.detail-section {
  flex: 1.2;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  min-height: 0;
}

.dc-head {
  padding: 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dc-head h3 {
  margin: 0;
  font-size: 1.4rem;
  font-weight: 800;
}

.dc-head .badge {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}

.dc-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.kgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.kbox {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius2);
  padding: 16px;
}

.kbox .l {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}

.kbox .v {
  font-size: 1.4rem;
  font-weight: 800;
  margin-top: 6px;
}

.kbox.green .v { color: var(--green); }
.kbox.blue .v { color: var(--blue); }
.kbox.amber .v { color: var(--amber); }
.kbox.purple .v { color: var(--purple); }

.hlist-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 0 0 12px;
}

/* ---- TABLAS CORREGIDAS ---- */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  text-align: right;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
  padding: 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
}

th:first-child, td:first-child { 
  text-align: left; 
}

td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--border);
  text-align: right; 
  font-variant-numeric: tabular-nums;
}

tr:hover td { background: var(--surface2); }
.hosp-name { font-weight: 600; }

.empty-detail {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  gap: 12px;
  text-align: center;
}

.empty-detail .big { font-size: 2.5rem; opacity: 0.5; }

/* Ajustes del Popup de Leaflet al diseño claro */
.leaflet-popup-content-wrapper { border-radius: var(--radius2); box-shadow: none; border: 1px solid var(--border); }
.leaflet-popup-content { margin: 12px; font-size: 13px; font-family: 'Inter', sans-serif; }
.leaflet-popup-content b { color: var(--green); font-size: 14px; display: block; margin-bottom: 4px; }

/* ---- TARJETA RESUMEN EJECUTIVO BID+PROSEPU (dentro de #project-cards) ---- */
.project-card-resumen {
  cursor: default;
  border-left: 4px solid var(--green);
  background: var(--surface);
}

.project-card-resumen:hover { background: var(--surface); }

.resumen-ia-row {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 12px;
  color: var(--txt);
}

.resumen-ia-row b { font-weight: 800; }
</style>
</head>
<body>

        <button type="button" id="btn-volver-mapa" onclick="volverMapaCompleto()" style="display:none;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;border-radius:var(--radius2);padding:6px 10px;cursor:pointer">↺ Ver todo el país</button>
        <div class="toggle-agrupar">
          <button type="button" class="toggle-btn active" id="btn-modo-provincia" onclick="cambiarModo('provincia')">Provincia</button>

let seleccionActual = null;
let TOTALES = { hosp: 0, est: 0, ia: 0, eq: 0 };

// --- Selector de idioma (solo esta interfaz) — español por defecto, italiano alternativo. ---

function t(clave) { return I18N[LANG][clave]; }

const TEXTOS_ESTATICOS = {
  'header-subtitle': 'subtitle',
  'lbl-prov-hosp': 'kpiProvHosp',
  'lbl-estudios': 'kpiEstudios',
  'lbl-ia': 'kpiIA',
  'lbl-equipos': 'kpiEquipos',
  'btn-modo-provincia': 'provincia',
  'btn-modo-proyecto': 'proyecto',
};

function aplicarTextosEstaticos() {
  for (const id in TEXTOS_ESTATICOS) {
    const el = document.getElementById(id);
    if (el) el.textContent = t(TEXTOS_ESTATICOS[id]);
  }
  document.getElementById('btn-volver-mapa').textContent = t('verTodoElPais');
  document.getElementById('map-section-label').textContent = modo === 'provincia' ? t('mapaArgentina') : t('hospPorProyecto');
}

function actualizarKpisNacionales() {
  document.getElementById('h-hosp').textContent = TOTALES.hosp;
  document.getElementById('h-est').textContent = TOTALES.est.toLocaleString(t('locale'));
  document.getElementById('h-ia').textContent = TOTALES.ia.toLocaleString(t('locale'));
  document.getElementById('h-eq').textContent = TOTALES.eq.toLocaleString(t('locale'));
}

function popupProvincia(p) {
  return '<b>' + p.provincia + '</b>' + p.n_hospitales + ' ' + t('hospitalesLbl') + '<br>' + p.estudios.toLocaleString(t('locale')) + ' ' + t('estudiosLbl');
}

function actualizarPopups() {
  PROV.forEach(p => {
    const m = markersPorProvincia[p.provincia];
    if (m) m.setPopupContent(popupProvincia(p));
  });
}

function cardResumenBidProsepu() {
  if (!RESUMEN_BID_PROSEPU) return '';
  const r = RESUMEN_BID_PROSEPU;
  const pct = r.estudios > 0 ? Math.round(r.ia / r.estudios * 100) : 0;
  return '<div class="project-card project-card-resumen">'
    + '<div class="project-card-name">' + t('footerTitulo') + '</div>'
    + '<div class="project-card-sub">' + r.estudios.toLocaleString(t('locale')) + ' ' + t('footerEstudiosTotales') + '</div>'
    + '<div class="resumen-ia-row">'
    + '<span><b style="color:var(--purple)">' + r.ia.toLocaleString(t('locale')) + '</b> ' + t('footerViaIA') + ' (' + pct + '%)</span>'
    + '</div>'
    + '</div>';
}

function cambiarIdioma(lang) {
  if (lang === LANG) return;
  LANG = lang;
  document.getElementById('btn-lang-es').classList.toggle('active', lang === 'es');
  document.getElementById('btn-lang-it').classList.toggle('active', lang === 'it');
  aplicarTextosEstaticos();
  actualizarKpisNacionales();
  actualizarPopups();
  if (modo === 'proyecto') renderProjectCards();
  if (seleccionActual) mostrarDetalle(seleccionActual); else resetPanelDetalle();
}

const CENT = {"Buenos Aires": [-36.5, -60.2], "CABA": [-34.61, -58.38], "Córdoba": [-32.0, -63.5], "Santa Fe": [-30.7, -60.9], "Tucumán": [-26.9, -65.2], "Chubut": [-43.8, -68.5], "Neuquén": [-38.9, -69.8], "Mendoza": [-34.9, -68.5], "Catamarca": [-27.3, -66.9], "Jujuy": [-23.3, -65.8], "Entre Ríos": [-32.0, -59.2], "Salta": [-24.3, -64.8], "San Juan": [-30.8, -68.9], "Formosa": [-24.9, -59.9], "La Rioja": [-29.7, -67.0], "Tierra del Fuego": [-53.8, -67.9], "Chaco": [-26.4, -60.5], "Corrientes": [-28.7, -57.8], "Río Negro": [-40.2, -67.2], "Santiago del Estero": [-27.8, -63.2], "Misiones": [-26.9, -54.5], "Santa Cruz": [-48.6, -70.0], "San Luis": [-33.7, -66.0], "La Pampa": [-37.2, -65.5]};

async function cargarProvincias() {
  aplicarTextosEstaticos();
  const res = await fetch('/api/provincias', { credentials: 'include' });
  if (res.status === 401) { window.location.href = '/'; return; }
  if (!res.ok) {
    document.getElementById('d-badge').textContent = t('errorCargando') + ' (' + res.status + ')';
    return;
  }
  const data = await res.json();
  PROV = data.provincias || [];
  PROY = data.proyectos || [];
  RESUMEN_BID_PROSEPU = data.resumen_bid_prosepu || null;

  let hosp = 0, est = 0, ia = 0, eq = 0;
  PROV.forEach(p => { hosp += p.n_hospitales; est += p.estudios; ia += p.ia; eq += p.equipos; });
  TOTALES = { hosp, est, ia, eq };

  document.getElementById('h-prov').textContent = PROV.length;
  actualizarKpisNacionales();
  if (modo === 'proyecto') renderProjectCards();

  initMap();
}
document.addEventListener('DOMContentLoaded', cargarProvincias);

let map, markers = [];
const markersPorProvincia = {};
let poligonosPorProvincia = {};

const ESTILO_POLIGONO_BASE = { color: '#0b7285', weight: 1, opacity: 0.4, fillColor: '#0b7285', fillOpacity: 0.04 };
const ESTILO_POLIGONO_SELECCIONADO = { color: '#e67700', weight: 2.5, opacity: 1, fillColor: '#e67700', fillOpacity: 0.35 };
const ESTILO_MARCADOR_SELECCIONADO = { color: '#e67700', weight: 3, fillColor: '#e67700', fillOpacity: 0.75 };

async function initMap() {
  if(map) { map.invalidateSize(); return; }

  // Carto "light_all" ahora exige API key registrada para uso anónimo
  // (mostraba watermark "API KEY REQUIRED" aunque la atribución estuviera
  // bien puesta). Usamos OpenStreetMap, que no la requiere; sus dominios
  // están sumados a img-src en la CSP del server (dashboard.py).
  map = L.map('map', {zoomControl: true, attributionControl: true}).setView([-40, -64], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    subdomains: ['a', 'b', 'c'],
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Malvinas son argentinas: el tile de OSM las rotula "Falkland Islands".
  // Tapamos esa etiqueta con la nuestra en español, siempre visible encima del mapa.
  L.marker([-51.75, -59.3], {
    icon: L.divIcon({
      className: 'etiqueta-malvinas',
      html: '<div style="background:#fff;padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700;color:#212529;white-space:nowrap;box-shadow:0 0 0 1px rgba(0,0,0,.08)">Islas Malvinas</div>',
      iconSize: null
    }),
    interactive: false,
    keyboard: false
  }).addTo(map);

  // Polígonos reales de las provincias (IGN / datos.gob.ar) — se cargan ANTES
  // que los marcadores para que queden debajo en el mapa.
  try {
    const geo = await fetch('/static/provincias_argentina.geojson').then(r => r.json());
    const capa = L.geoJSON(geo, {
      style: () => ESTILO_POLIGONO_BASE,
      onEachFeature: (feature, layer) => {
        const nombre = feature.properties.nombre;
        poligonosPorProvincia[nombre] = layer;
        layer.on('click', () => {
          const p = PROV.find(x => x.provincia === nombre);
          if (p) seleccionarProvincia(p);
        });
      }
    }).addTo(map);
  } catch (e) {
    console.error('No se pudo cargar el contorno de provincias:', e);
  }

  const maxEst = Math.max(...PROV.map(p => p.estudios), 1);

  PROV.forEach(p => {
    const c = CENT[p.provincia];
    if(!c) return;

    const r = 8 + 22 * Math.sqrt(p.estudios / maxEst);
    const estiloBase = { radius: r, color: '#0b7285', weight: 1.5, fillColor: '#0b7285', fillOpacity: 0.35 };
    const m = L.circleMarker(c, estiloBase)
      .addTo(map)
      .bindPopup(popupProvincia(p));
    m._estiloBase = estiloBase;
    markersPorProvincia[p.provincia] = m;

    // Al hacer click: pintar la superficie real de la provincia, hacer zoom
    // sobre ella y actualizar el panel derecho en lugar de abrir vista nueva.
    m.on('click', () => seleccionarProvincia(p));
    m.on('mouseover', function() { if (this !== markerSeleccionado) this.setStyle({fillOpacity: 0.65}); });
    m.on('mouseout', function() { if (this !== markerSeleccionado) this.setStyle(this._estiloBase); });
    markers.push(m);
  });
}

let markerSeleccionado = null;
let poligonoSeleccionado = null;

function seleccionarProvincia(p) {
  if (markerSeleccionado) markerSeleccionado.setStyle(markerSeleccionado._estiloBase);
  if (poligonoSeleccionado) poligonoSeleccionado.setStyle(ESTILO_POLIGONO_BASE);

  const m = markersPorProvincia[p.provincia];
  const poly = poligonosPorProvincia[p.provincia];

  if (m) {
    m.setStyle(Object.assign({}, ESTILO_MARCADOR_SELECCIONADO, { radius: m._estiloBase.radius + 6 }));
    markerSeleccionado = m;
  }

  if (poly) {
    poly.setStyle(ESTILO_POLIGONO_SELECCIONADO);
    poly.bringToFront();
    poligonoSeleccionado = poly;
    map.flyToBounds(poly.getBounds(), { padding: [30, 30], duration: 0.8 });
  } else if (m) {
    map.flyTo(m.getLatLng(), 6, { duration: 0.8 });
  }

  document.getElementById('btn-volver-mapa').style.display = 'inline-block';
  mostrarDetalle(p);
}

function volverMapaCompleto() {
  if (markerSeleccionado) {
    markerSeleccionado.setStyle(markerSeleccionado._estiloBase);
    markerSeleccionado = null;
  }
  if (poligonoSeleccionado) {
    poligonoSeleccionado.setStyle(ESTILO_POLIGONO_BASE);
    poligonoSeleccionado = null;
  }
  document.getElementById('btn-volver-mapa').style.display = 'none';
  if (map) map.flyTo([-40, -64], 4, { duration: 0.8 });
  resetPanelDetalle();
}

function kbox(label, val, cls) {
  return '<div class="kbox ' + (cls || '') + '"><div class="l">' + label + '</div><div class="v">' + val + '</div></div>';
}

function tooltipEstudiosAnual(h) {
  let tip = t('tipEstudiosAnual');
  if (h.estudios_pacs_anual_estimado && h.estudios_pacs_anual_meses_base != null) {
    tip += ' ' + t('tipBaseMeses') + ' ' + h.estudios_pacs_anual_meses_base + ' ' + t('tipMesesSufijo');
  }
  return tip;
}

function mostrarDetalle(p) {
  seleccionActual = p;
  const nombre = p.provincia || p.proyecto;
  document.getElementById('d-name').textContent = nombre;
  document.getElementById('d-badge').textContent = p.n_hospitales + ' ' + t('hospitalesEnMonitoreo');

  const k = [
    kbox(t('kEstudios'), p.estudios.toLocaleString(t('locale')), 'green'),
    kbox(t('kAdmitidas'), p.admitidas.toLocaleString(t('locale')), 'blue'),
    kbox(t('kAsociadas'), p.asociadas.toLocaleString(t('locale')), 'blue'),
    kbox(t('kDefinitivas'), p.definitivas.toLocaleString(t('locale')), 'blue'),
    kbox(t('kEstudiosIA'), p.ia.toLocaleString(t('locale')), 'purple'),
    kbox(t('kEquipos'), p.equipos, 'amber'),
    kbox(t('kTBAlm'), (p.tb_alm != null ? p.tb_alm : '-'), 'amber'),
    kbox(t('kRAM'), (p.ram != null ? p.ram + '%' : '-'), '')
  ].join('');

  let rows = p.hospitales.map(h => '<tr' + (h.pendiente_carga ? ' style="opacity:.55"' : '') + '>'
    + '<td class="hosp-name">' + h.nombre + (h.pendiente_carga ? ' <span style="font-size:.75em;color:var(--amber);font-weight:600">' + t('sinDatosCargados') + '</span>' : '') + '</td>'
    + '<td style="text-align:left;font-family:monospace;font-size:.85em;color:var(--muted)">' + h.id + '</td>'
    + '<td>' + h.estudios.toLocaleString(t('locale')) + '</td>'
    + '<td title="' + tooltipEstudiosAnual(h) + '">' + (h.estudios_pacs_anual != null ? (h.estudios_pacs_anual_estimado ? t('estAnualAprox') : '') + h.estudios_pacs_anual.toLocaleString(t('locale')) : '-') + '</td>'
    + '<td>' + h.admitidas.toLocaleString(t('locale')) + '</td>'
    + '<td>' + h.ia.toLocaleString(t('locale')) + '</td>'
    + '<td>' + h.equipos + '</td>'
    + '<td>' + (h.tb_alm != null ? h.tb_alm : '-') + '</td>'
    + '<td>' + (h.ram != null ? h.ram + '%' : '-') + '</td>'
    + '</tr>').join('');

  document.getElementById('d-body').innerHTML =
    '<div class="kgrid">' + k + '</div>'
    + '<p class="hlist-title">' + t('hospitalesDe') + ' ' + nombre + '</p>'
    + '<table><thead><tr><th>' + t('thHospital') + '</th><th style="text-align:left">' + t('thCodigo') + '</th><th>' + t('thEstudios') + '</th><th title="' + t('tipEstudiosAnual') + '">' + t('thEstudiosAnual') + '</th><th>' + t('thAdmitidas') + '</th><th>' + t('thIA') + '</th><th>' + t('thEquipos') + '</th><th>' + t('thTB') + '</th><th>' + t('thRAM') + '</th></tr></thead><tbody>'
    + rows + '</tbody></table>';
}

function resetPanelDetalle() {
  seleccionActual = null;
  document.getElementById('d-name').textContent = t('panelNacional');
  document.getElementById('d-badge').textContent = modo === 'provincia'
    ? t('selProvinciaMapa')
    : t('selProyecto');
  document.getElementById('d-body').innerHTML =
    '<div class="empty-detail"><div class="big">&#128072;</div><div>'
    + (modo === 'provincia' ? t('clickMarcadorProvincia') : t('clickProyecto'))
    + '</div></div>';
}

const PROYECTO_COLOR = {"BID": "#1c7ed6", "PROSEPU": "#0b7285", "Otros": "#868e96"};

function renderProjectCards() {
  const cont = document.getElementById('project-cards');
  cont.innerHTML = PROY.map(p => (
    '<div class="project-card" style="border-left:4px solid ' + (PROYECTO_COLOR[p.proyecto] || '#868e96') + '" onclick="mostrarDetalleProyecto(\'' + p.proyecto + '\')">'
    + '<div class="project-card-name">' + p.proyecto + '</div>'
    + '<div class="project-card-sub">' + p.n_hospitales + ' ' + t('hospitalesLbl') + ' · ' + p.estudios.toLocaleString(t('locale')) + ' ' + t('estudiosLbl') + '</div>'
    + '</div>'
  )).join('') + cardResumenBidProsepu();
}

function mostrarDetalleProyecto(nombre) {
  const p = PROY.find(x => x.proyecto === nombre);
  if (p) mostrarDetalle(p);
}

let modo = 'provincia';

function cambiarModo(nuevo) {
  if (modo === nuevo) return;
  modo = nuevo;
  document.getElementById('btn-modo-provincia').classList.toggle('active', nuevo === 'provincia');
  document.getElementById('btn-modo-proyecto').classList.toggle('active', nuevo === 'proyecto');
  document.getElementById('map-section-label').textContent = nuevo === 'provincia' ? t('mapaArgentina') : t('hospPorProyecto');
  document.getElementById('map').style.display = nuevo === 'provincia' ? 'block' : 'none';
  document.getElementById('project-cards').style.display = nuevo === 'proyecto' ? 'flex' : 'none';

  if (nuevo === 'provincia') {
    if (map) { map.invalidateSize(); } else { initMap(); }
  } else {
    if (markerSeleccionado) {
      markerSeleccionado.setStyle(markerSeleccionado._estiloBase);
      markerSeleccionado = null;
    }
    if (poligonoSeleccionado) {
      poligonoSeleccionado.setStyle(ESTILO_POLIGONO_BASE);
      poligonoSeleccionado = null;
    }
    document.getElementById('btn-volver-mapa').style.display = 'none';
    renderProjectCards();
  }
  resetPanelDetalle();
}
</script>
</body>
